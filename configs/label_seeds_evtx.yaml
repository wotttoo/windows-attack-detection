  execution_evasion_visual_studio_prebuild_event:
    mode: seeds
    note: 'pre-build event của project Visual Studio chạy lệnh; phần build bình thường là benign'
    parent_launcher: false
    cmd: ['\\Temp\\tmp[0-9a-f]{32}\.exec\.cmd', 'start-process notepad']
    events:
      - {provider: Sysmon, eid: [11], field: FileName, match: '\\Temp\\tmp[0-9a-f]{32}\.exec\.cmd'}
  rogue_msi_url_1040_1042:
    mode: seeds
    note: 'chỉ gói MSI cài từ URL; còn lại là cài đặt Office / Google / .NET bình thường'
    events:
      - {provider: MsiInstaller, field: param1, match: '^https?://'}
  susp_explorer_exec_root_cmdline_@rimpq_@CyberRaiju:
    noise: [{eid: [13], image: '^svchost\.exe$'}]

  # ======== Lateral Movement
  ImpersonateUser-via local Pass The Hash Sysmon and Security: {}
  LM_ScheduledTask_ATSVC_target_host:
