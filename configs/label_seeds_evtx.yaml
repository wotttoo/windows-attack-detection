    parent_launcher: false
    cmd: ['\\Downloads\\a\.exe', 'BRE6BgE2JubB\.exe', '\\vbc\.exe"?\s+/stext']

  # ======== Privilege Escalation
  privesc_registry_symlink_CVE-2020-1377:
    noise:
      - {image: '^(LogonUI|smss|spoolsv)\.exe$'}
  privesc_spoolsv_spl_file_write_sysmon11:
