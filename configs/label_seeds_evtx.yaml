  # ======== Persistence
  persist_firefox_comhijack_sysmon_11_13_7_1: {}
  persistence_sysmon_11_13_1_shime_appfix:
    mode: seeds
    note: 'log nhiều giờ, có reboot; máy còn sót persistence của các bài thử khác (uncertain)'
    parent_launcher: false
    cmd: ['sdbinst', 'Compatadmin', '^"?c:\\osk\.exe']
    events:
      - {provider: Sysmon, eid: [11, 13], match: 'AppCompatFlags\\(Custom|InstalledSDB)|\\AppPatch\\Custom\\', process: true}
    uncertain:
      - {eid: [1], ProcessCommandLine: '^calc\.exe$|malwr\.vbs|hello from run key|PSEXESVC|FreeSSHDService'}
      - {eid: [11], FileName: 'wodCmdTerm'}
  sysmon_13_1_persistence_via_winlogon_shell:
