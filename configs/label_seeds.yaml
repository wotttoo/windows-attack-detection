# Hạt giống để gán nhãn event độc hại (dùng bởi label_events.py)
#
#   cmd:    regex trên command line / đường dẫn image của process -> process đó độc hại (và lan theo cây process)
#   script: regex trên nội dung PowerShell (ScriptBlockText, CommandLine, Payload, HostApplication)
#           -> event đó độc hại, process powershell ghi log (ExecutionProcessId) cũng độc hại
#   events: điều kiện trên 1 event bất kỳ:
#             eid: [..]       EventId (tuỳ chọn)
#             provider: re    regex trên Provider (tuỳ chọn)
#             host: re        regex trên DvcHostname (tuỳ chọn)
#             match: re       regex trên toàn bộ giá trị chuỗi của event
#             field: tên      chỉ so khớp match trên trường này (vd ProcessFilePath)
#             process: true   coi luôn process sinh ra event là độc hại
#   skip:   true -> không gán nhãn file này (dữ liệu quá ít / không phải tấn công)
#
# Khoá của scenarios = tên kịch bản (tên file bỏ phần timestamp).

generic:
  cmd:
    - '-noP\s+-sta\s+-w\s+1\s+-enc'                                    # Empire launcher
    - '\s-e(nc(odedcommand)?)?\s+[A-Za-z0-9+/=]{200,}'                 # PowerShell base64 dài
    - 'IO\.Compression\.DeflateStream\(\[IO\.MemoryStream\]\[Convert\]::FromBase64String'   # Covenant launcher
    - 'Grunt\w*\.(exe|dll)'                                            # Covenant Grunt
    - 'mimikatz'
    - '\bRubeus\.exe'
    - '\bSeatbelt\.exe'
    - '\bSharpView\.exe'
    - '\bPurpleSharp\.exe'
    - 'Outflank-Dumpert'
    - 'ProcessHerpaderping'
    - 'SharpZeroLogon'
    - 'MoveExcel\w*\.exe'
    - '\bPsExec(64)?\.exe'
    - 'PSEXESVC\.exe'
    - 'reg(\.exe)?\s+save\s+HKLM\\+(sam|system|security)'
  script:
    - 'Invoke-Mimikatz'
    - 'Invoke-(PSRemoting|SMBExec|PsExec|DCOM|WMI|ExecuteMSBuild|DllInjection|PSInject|InternalMonologue|BypassUAC)'

# Tách nhãn command-and-control: event của implant C2 (agent Empire, Grunt Covenant...) mà chỉ là duy trì liên lạc.
# Hành động của kịch bản (module chạy trong agent, truy cập lsass, process con, kết nối sang máy khác...) giữ tactic gốc.
c2:
  implant:            # process là implant: command line / image khớp mẫu này (cộng agent trong metadata, process bị implant inject)
    - '-noP\s+-sta\s+-w\s+1\s+-enc'
    - '\s-e(nc(odedcommand)?)?\s+[A-Za-z0-9+/=]{200,}'
    - 'IO\.Compression\.DeflateStream\(\[IO\.MemoryStream\]\[Convert\]::FromBase64String'
    - 'Grunt\w*\.(exe|dll)'
  beacon:             # nội dung PowerShell của vòng lặp liên lạc (Empire agent)
    - 'Start-Sleep'
    - '\$script:TaskURIs|\$script:Headers|\$script:ControlServers'
    - 'System\.Net\.WebClient|DownloadData|UploadData'
    - '\[BitConverter\]::GetBytes\(\$\(Get-Random\)\)'
    - '0\.\.255\s*\|\s*(ForEach-Object|%)'
    - 'AesCryptoServiceProvider|HMACSHA256|Compare-Object \$mac'
    - 'Remove-Variable packet|RoutingPacket|Process-Tasking|Send-Message|Get-Task|Encrypt-Bytes|Decrypt-Bytes'
    - '^\s*Get-Random\s*$|CommandInvocation\(Get-Random\)|Get-Random -count 16'
    - '\$S\[\$_\]|\$K\[\$_\s*%|%\s*256'                                     # RC4 của Empire
    - 'CommandInvocation\((Compare-Object|Remove-Variable)\)'
    - 'New-Object Byte\[\]|value="Byte\[\]"|IO\.StringWriter|Format-Table -wrap \| Out-String'  # dựng gói / trả kết quả
    - '\.Headers\.Add\(|CommandInvocation\(Format-Table\)'
  ports: [80, 443, 8080, 8443]   # kết nối của implant tới các cổng này = kênh C2
  runtime:            # event "nền" của implant (agent nào cũng sinh ra) -> C2, trừ khi chạm đối tượng nhạy cảm
    Microsoft-Windows-Sysmon: [7, 12, 22]                       # nạp DLL, tạo/xoá khoá registry, DNS
    Microsoft-Windows-Security-Auditing: [4656, 4658, 4663, 4690, 4703]   # handle, quyền token
  sensitive: 'lsass|\\SAM\b|\\SECURITY\b|NTDS|\\Lsa\b|samlib\.dll|vaultcli\.dll|dbghelp\.dll|dbgcore\.dll|comsvcs\.dll'

